name: Build playlist

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "check.py", ".github/workflows/build.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build playlist
        run: python build.py
      - name: Commit playlist if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-channels.m3u
          git diff --cached --quiet || git commit -m "Update playlist"
          git push
      - name: Prepare site
        run: |
          mkdir site
          cp english-channels.m3u site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
